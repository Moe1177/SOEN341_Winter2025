name: CI Pipeline

on: 
  push:
  pull_request:
  schedule:
    # Run every 10 minutes to keep the app warm
    - cron: '*/10 * * * *'
  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # Add the app-warmer job that only runs on schedule events
  app-warmer:
    name: Keep App Warm
    runs-on: ubuntu-latest
    # This job only runs when triggered by the schedule
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Send HTTP request
        env:
          APP_URL: ${{ secrets.APP_BACKEND_URL }}
        run: |
          # Store the response code
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: AppWarmer/1.0 (GitHub-Actions)" \
            -m 30 \
            "${APP_URL}")
          
          # Print timestamp and response (without exposing the full URL)
          echo "App warmer ping sent at $(date)"
          echo "Response code: $RESPONSE_CODE"
          
          # Check if the response was successful
          if [[ "$RESPONSE_CODE" -ge 200 && "$RESPONSE_CODE" -lt 300 ]]; then
            echo "✅ App successfully warmed"
          else
            echo "❌ App warming failed with response code: $RESPONSE_CODE"
          fi

  lint:
    name: Super-Linter
    runs-on: ubuntu-latest
    # Only run this job for push and pull_request events, not for schedules
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter@v7
        env:
          # Can be used to check only the changes
          VALIDATE_ALL_CODEBASE: false
          JAVA_FILE_NAME: checkstyle.xml
          CSS_FILE_NAME: stylelint.json
          LINTER_RULES_PATH: .github/configs
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORE_GITIGNORED_FILES: true
          VALIDATE_MARKDOWN: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_BASH_EXEC: false
          VALIDATE_CSS_PRETTIER: false
          VALIDATE_SHELL_SHFMT: false
          VALIDATE_YAML_PRETTIER: false
          VALIDATE_JSCPD: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_TYPESCRIPT_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_CHECKOV: false
          VALIDATE_GOOGLE_JAVA_FORMAT : false
          VALIDATE_JAVA : false


  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soen341-backend
    # Only run this job for push and pull_request events, not for schedules
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: lint  # Ensure linting passes before backend build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maven
        run: sudo apt-get install -y maven  # Ensures Maven is installed

      - name: Build & Test Backend
        env:
          SOEN341_MONGODB_URI: ${{ secrets.SOEN341_MONGODB_URI }}
          SOEN341_EMAIL: ${{ secrets.SOEN341_EMAIL }}
          SOEN341_EMAIL_PASSWORD: ${{ secrets.SOEN341_EMAIL_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: mvn clean package -Dcheckstyle.skip=true -Dcheckstyle.skipExec=true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soen341-frontend
    # Only run this job for push and pull_request events, not for schedules
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: lint  # Ensure linting passes before frontend build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Test Frontend
        # Check if the test file exists, if it doesn't, don't fail
        run: |
          if npm run | grep -q " test"; then
          npm test
          else
            echo "No test script found. Skipping tests."
          fi

      - name: Build Frontend
        run: npm run build